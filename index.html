<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Post-its</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="pantallaLogin">

        <h1>Pizarra de Post-its</h1>

        <div id="auth">

            <input
                type="email"
                id="email"
                placeholder="Correo">

            <input
                type="password"
                id="password"
                placeholder="Contraseña">

            <button id="btnRegistro">
                Registrarse
            </button>

            <button id="btnLogin">
                Iniciar sesión
            </button>

            <button id="btnGoogle">
                Google
            </button>

        </div>

    </div>

    <div id="pantallaApp" style="display:none;">

        <header>
            <h1>Pizarra de Post-its</h1>

            <button id="btnLogout">
                Cerrar sesión
            </button>
        </header>

        <main>

            <form id="formNota">

                <input
                    type="text"
                    id="textoNota"
                    placeholder="Escribe una nota...">

                <button type="submit">
                    Crear nota
                </button>

            </form>

            <section id="tablero"></section>

        </main>

    </div>

    <script type="module" src="js/app.js"></script>

</body>

</html>
